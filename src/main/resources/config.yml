auto-encrypt-packs: true
# Must be exactly 32 characters.
# Leave empty to auto-generate on first startup.
encryption-key: ""
# Packs that must stay readable: they are served as-is, without encryption.
# One file name per line, taken from the resource_packs folder.
# Case-insensitive, the extension is optional.
# Example:
# excluded-packs:
#   - LinesiaPackUI.zip
#   - LinesiaEntity
excluded-packs: []
# Strip indentation and comments from the JSON files of the encrypted packs.
# Encrypted files no longer compress: without this, every indentation byte is downloaded.
minify-json: true
