auto-encrypt-packs: true
# Must be exactly 32 characters.
# Leave empty to auto-generate on first startup.
encryption-key: ""
# Packs that must stay readable: they are served as-is, without encryption.
# One file name per line, taken from the resource_packs folder.
# Case-insensitive, the extension is optional.
# Example:
# excluded-packs:
#   - LinesiaPackUI.zip
#   - LinesiaEntity
excluded-packs: []
# Strip indentation and comments from the JSON files of the encrypted packs.
# Encrypted files no longer compress: without this, every indentation byte is downloaded.
minify-json: true
# Re-encode the PNG files of the encrypted packs in their smallest form, pixel for pixel identical.
# Results are cached in cache/, only new or changed images are re-encoded at startup.
optimize-png: true
# Packs sent as one: each entry is the name of the pack to build and the packs of the
# resource_packs folder it gathers (same names as excluded-packs). The client downloads and
# loads one pack instead of all of them; the sources stay in resource_packs as they are.
# Example:
# merged-packs:
#   MyEvents:
#     - EventPackOne
#     - EventPackTwo
merged-packs: {}
# Paths left out of the encrypted packs (prefixes): files a pack carries for the server or for its
# tools, which the game never reads but would still download. Hidden files are always left out.
# Example:
# strip-paths:
#   - server_assets/
#   - README.md
strip-paths: []
# Re-encode at 22.05 kHz the sounds of the packs that have nothing above 11 kHz (same sound to the
# ear, far fewer bytes). Needs ffmpeg with libvorbis; loops and sounds over 10 s are left alone.
optimize-ogg: false
ffmpeg: ffmpeg
# Also lighten the excluded packs (minified JSON, re-encoded PNG and sounds), still sent in clear.
optimize-excluded-packs: false
# Shrink the JSON UI files of the encrypted packs with the game's own templates and variables:
# controls of the same shape share one template, each keeps only its own values. Every file is
# expanded back and compared with the original before being kept.
compress-ui: false
